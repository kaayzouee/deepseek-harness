name: DSH security and release gate

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dsh-security-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Frozen lockfile, security, tests and release
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      DSH_TELEMETRY_DISABLED: '1'
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Activate pinned pnpm
        run: corepack enable && corepack prepare pnpm@11.28.5 --activate
      - name: Frozen dependency install without lifecycle scripts
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Verify all workspace package dependencies
        run: pnpm run verify-package-dependencies
      - name: Verify DSH release family and publication order
        run: pnpm run release:verify --family dsh
      - name: Reject vulnerable or duplicate Zod lockfile resolutions
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs'
          const lock = readFileSync('pnpm-lock.yaml', 'utf8')
          const matches = [...lock.matchAll(/^  ['"]?zod@(\d+\.\d+\.\d+)(?:\([^\n]*)?['"]?:/gm)]
          const versions = [...new Set(matches.map(m => m[1]))]
          if (versions.length !== 1 || versions[0] !== '4.6.7') {
            throw new Error('expected only patched zod@4.6.7 in lockfile; found ' + JSON.stringify(versions))
          }
          if (/(?:^|[^\d])zod@4\.4\.3(?:[^\d]|$)/m.test(lock)) {
            throw new Error('vulnerable zod@4.4.3 remains in lockfile')
          }
          console.log('Locked Zod resolution:', versions[0])
          NODE
      - name: Audit complete host production dependency graph
        run: pnpm audit --prod --audit-level high
      - name: Targeted dependency and release regression tests
        run: pnpm exec vitest run scripts/release
      - name: Verify package manifest unchanged by frozen install
        run: git diff --exit-code -- package.json pnpm-lock.yaml
