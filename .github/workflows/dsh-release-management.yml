# Prepare a consistent DSH release family bump, or tag a previously validated
# release commit. Both operations are explicit and run only from master.
# npm publication stays a separate, protected workflow_dispatch.
name: Prepare or tag DSH release

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Prepare version-bump PR or tag a validated master commit
        required: true
        type: choice
        options:
          - prepare
          - tag
      version:
        description: Full semver, for example 0.2.2-rc.2
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: dsh-release-management
  cancel-in-progress: false

jobs:
  release-management:
    name: ${{ inputs.operation }} dsh-v${{ inputs.version }}
    if: github.ref == 'refs/heads/master' && github.repository == 'kaayzouee/deepseek-harness'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: write
      pull-requests: write
      actions: read
    env:
      VERSION: ${{ inputs.version }}
      DSH_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v5.0.0
        with:
          dest: ${{ runner.temp }}/setup-pnpm
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Validate release input
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z][0-9A-Za-z.-]*)?$ ]] || {
            echo "invalid semantic release version: $VERSION" >&2
            exit 1
          }
          test "$(git branch --show-current)" = master
      - name: Immutable dependency installation without lifecycle scripts
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Prepare family-wide version bump
        if: inputs.operation == 'prepare'
        run: |
          set -euo pipefail
          branch="release/dsh-v$VERSION"
          if git ls-remote --exit-code --heads origin "$branch"; then
            echo "release branch already exists: $branch" >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "$branch"
          pnpm run release:dsh "$VERSION"
          test "$(node -p 'require("./package.json").version')" = "$VERSION"
          # Verify the release script rewrote the lockfile consistently.
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm run verify-package-dependencies
          pnpm run release:verify --family dsh
          pnpm audit --prod --audit-level high
          test -z "$(git status --porcelain)"
      - name: Open release PR (no tag or package publication)
        if: inputs.operation == 'prepare'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh auth setup-git
          git push --set-upstream origin "HEAD:refs/heads/release/dsh-v$VERSION"
          gh pr create --base master --head "release/dsh-v$VERSION" \
            --title "release(dsh): $VERSION" \
            --body "Generated by the release-management workflow using \`pnpm run release:dsh $VERSION\`. All DSH family manifests and the frozen pnpm lockfile must pass PR CI and release pack verification before merge. No npm publication occurs in this PR."
      - name: Verify merged release version and immutable dependency graph
        if: inputs.operation == 'tag'
        run: |
          set -euo pipefail
          test "$(node -p 'require("./package.json").version')" = "$VERSION"
          pnpm run verify-package-dependencies
          pnpm run release:verify --family dsh
          pnpm audit --prod --audit-level high
          test -z "$(git status --porcelain)"
      - name: Require green release and security runs for exact master commit
        if: inputs.operation == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sha=$(git rev-parse HEAD)
          runs=$(gh api -X GET "repos/$GITHUB_REPOSITORY/actions/runs" \
            -f head_sha="$sha" -f per_page=100)
          for workflow in 'Release (dsh)' 'DSH security and release gate'; do
            if ! jq -e --arg name "$workflow" --arg sha "$sha" \
              '[.workflow_runs[] | select(.name == $name and .head_sha == $sha and .conclusion == "success")] | length > 0' \
              <<<"$runs"; then
              echo "No successful $workflow run for master commit $sha" >&2
              exit 1
            fi
          done
      - name: Tag validated commit and create GitHub release
        if: inputs.operation == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="dsh-v$VERSION"
          sha=$(git rev-parse HEAD)
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git rev-parse -q --verify "refs/tags/$tag^{commit}" >/dev/null; then
            test "$(git rev-parse "refs/tags/$tag^{commit}")" = "$sha" || {
              echo "$tag already points at a different commit" >&2
              exit 1
            }
          else
            git tag -a "$tag" -m "DSH $VERSION"
            gh auth setup-git
            git push origin "refs/tags/$tag"
          fi
          if ! gh release view "$tag" >/dev/null 2>&1; then
            if [[ "$VERSION" == *-* ]]; then
              gh release create "$tag" --verify-tag --title "$tag" --generate-notes --prerelease
            else
              gh release create "$tag" --verify-tag --title "$tag" --generate-notes
            fi
          fi
          {
            echo "Validated DSH release: $tag"
            echo ""
            echo "Pinned source commit: $sha"
            echo ""
            echo "Repin neodots and recompute both Nix fixed-output hashes before merging its packaging PR."
            echo "npm publication remains the manual Release publish (dsh) workflow."
          } >> "$GITHUB_STEP_SUMMARY"
